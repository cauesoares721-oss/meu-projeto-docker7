name: CI

"on":
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar .env
        run: cp .env.example .env

      - name: Validar Compose
        run: docker compose config

      - name: Build
        run: docker compose build

      - name: Subir containers
        run: docker compose up -d

      - name: Esperar aplicação
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/items > /dev/null; then
              echo "Aplicação pronta!"
              exit 0
            fi
            sleep 3
          done

          docker compose logs
          exit 1

      - name: Smoke Test
        run: |
          curl -sf -X POST http://localhost:3000/items \
          -H "Content-Type: application/json" \
          -d '{"id":"ci-test","name":"Teste CI","completed":false}'

          curl -sf http://localhost:3000/items | grep "Teste CI"

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Finalizar
        if: always()
        run: docker compose down -v
